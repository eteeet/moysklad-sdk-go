name: CI

on:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make gen
      - run: make lint
      - run: make test
      - name: После make gen и линтера нет изменений
        run: |
          git status --porcelain
          git diff --exit-code
          test -z "$(git status --porcelain)"
